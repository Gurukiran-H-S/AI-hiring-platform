<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
    
    <linearGradient id="purpleBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="rightPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <linearGradient id="leftPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0047BA" />
      <stop offset="100%" stop-color="#002277" />
    </linearGradient>

    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>

    <linearGradient id="greenCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0047BA" flood-opacity="0.25" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- BACKGROUND "H" LEFT PILLAR & AI PROFILE -->
  <g filter="url(#softShadow)">
    <!-- Left Pillar Base -->
    <path d="M 130 50 
             C 145 50 155 60 155 75 
             L 155 180 
             C 135 190 120 210 120 235 
             C 120 275 145 310 185 325 
             L 175 340 
             C 140 340 125 315 125 285 
             L 125 75 
             C 125 60 115 50 130 50 Z" 
          fill="url(#leftPillarGrad)" />

    <!-- Left Pillar Top Cap -->
    <path d="M 105 50 
             L 155 50 
             C 165 50 172 58 172 68 
             L 172 165 
             C 158 152 142 148 125 148 
             L 125 72 
             C 125 60 115 50 105 50 Z" 
          fill="url(#leftPillarGrad)" />

    <!-- Swirling Bottom Arc of Left Pillar connecting to center -->
    <path d="M 125 230 
             C 125 300 160 345 220 345 
             C 245 345 260 335 270 320 
             C 255 315 240 295 240 270 
             C 240 230 265 195 305 185 
             C 275 175 240 185 220 210 
             C 195 240 175 250 150 250 
             C 135 250 128 242 125 230 Z" 
          fill="url(#leftPillarGrad)" />

    <!-- AI Profile Head (facing left) on top-left of H -->
    <path d="M 140 75
             C 115 75 90 95 88 125
             C 86 138 88 148 94 156
             L 75 168
             L 90 175
             C 88 182 88 190 92 195
             L 80 200
             L 94 207
             C 98 218 108 226 122 230
             C 132 233 145 230 155 220
             C 142 205 136 185 138 160
             C 140 120 152 95 152 75
             Z" 
          fill="url(#blueCyanGrad)" />

    <!-- AI Brain Circuit Trace Nodes & Lines -->
    <!-- Nodes -->
    <circle cx="106" cy="118" r="4.5" fill="#FFFFFF" />
    <circle cx="126" cy="112" r="4.5" fill="#FFFFFF" />
    <circle cx="140" cy="130" r="4" fill="#FFFFFF" />
    <circle cx="112" cy="148" r="4.5" fill="#FFFFFF" />
    <circle cx="132" cy="165" r="4.5" fill="#FFFFFF" />
    <circle cx="104" cy="178" r="4" fill="#FFFFFF" />
    <circle cx="122" cy="195" r="4" fill="#FFFFFF" />

    <!-- Neural Circuit Connections -->
    <path d="M 106 118 L 126 112 M 126 112 L 140 130 M 106 118 L 112 148 M 112 148 L 132 165 M 112 148 L 104 178 M 132 165 L 122 195 M 104 178 L 122 195" 
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Elegant Flowing Neck Ribbon / AI swoop -->
    <path d="M 125 230
             C 135 285 170 330 225 335
             C 175 320 148 280 145 230 Z" 
          fill="#00D2FF" opacity="0.85" />
  </g>

  <!-- RIGHT "H" PILLAR -->
  <g filter="url(#softShadow)">
    <path d="M 315 50
             C 305 50 295 60 295 72
             L 295 328
             C 295 340 305 350 317 350
             L 348 350
             C 360 350 370 340 370 328
             L 370 72
             C 370 60 360 50 348 50
             Z" 
          fill="url(#rightPillarGrad)" />
  </g>

  <!-- CENTER MAGNIFYING GLASS HANDLE & RIM (Indigo/Violet) -->
  <!-- Handle extending down-right -->
  <g filter="url(#softShadow)">
    <path d="M 295 265 
             L 345 325 
             C 355 337 372 337 382 327 
             C 392 317 392 300 380 290 
             L 330 230 
             Z" 
          fill="url(#handleGrad)" />
    
    <!-- Handle detail stripe -->
    <path d="M 322 255 L 365 308" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- CENTER MAGNIFYING GLASS LENS RING -->
  <g filter="url(#softShadow)">
    <!-- Outer Ring -->
    <circle cx="260" cy="195" r="70" fill="url(#purpleBlueGrad)" />
    
    <!-- Inner White Bezel -->
    <circle cx="260" cy="195" r="54" fill="#FFFFFF" />

    <!-- Inner Candidate Avatar Circle -->
    <circle cx="260" cy="195" r="48" fill="url(#avatarBgGrad)" />

    <!-- Professional Candidate Silhouette inside Lens -->
    <!-- Head -->
    <circle cx="260" cy="172" r="16" fill="#FFFFFF" />
    
    <!-- Shoulders & Suit with Tie -->
    <path d="M 230 228 
             C 230 206 244 196 260 196 
             C 276 196 290 206 290 228 
             Z" 
          fill="#FFFFFF" />
    
    <!-- Suit Inner Collar / Shirt (Navy/Blue) -->
    <path d="M 252 196 L 260 216 L 268 196 Z" fill="#0038A8" />
    <!-- Tie (Navy) -->
    <path d="M 258 206 L 262 206 L 264 222 L 260 227 L 256 222 Z" fill="#002277" />
  </g>

  <!-- RIGHT SIDE CANDIDATE EVALUATION CARD -->
  <g filter="url(#cardShadow)">
    <!-- Card Base (White with soft border) -->
    <rect x="330" y="80" width="130" height="155" rx="16" fill="#FFFFFF" />
    <rect x="330" y="80" width="130" height="155" rx="16" stroke="#E2E8F0" stroke-width="2" />

    <!-- ─── ROW 1: Candidate Profile + Stars ─── -->
    <g transform="translate(342, 94)">
      <!-- Avatar Icon -->
      <circle cx="16" cy="16" r="12" fill="#E2E8F0" />
      <circle cx="16" cy="12" r="4.5" fill="#64748B" />
      <path d="M 9 22 C 9 18.5 12 17 16 17 C 20 17 23 18.5 23 22 Z" fill="#64748B" />

      <!-- 3 Gold Stars -->
      <!-- Star 1 -->
      <path d="M 42 12 L 44 16 L 48 16.5 L 45 19.5 L 46 23.5 L 42 21 L 38 23.5 L 39 19.5 L 36 16.5 L 40 16 Z" fill="#FBBF24" />
      <!-- Star 2 -->
      <path d="M 56 12 L 58 16 L 62 16.5 L 59 19.5 L 60 23.5 L 56 21 L 52 23.5 L 53 19.5 L 50 16.5 L 54 16 Z" fill="#FBBF24" />
      <!-- Star 3 -->
      <path d="M 70 12 L 72 16 L 76 16.5 L 73 19.5 L 74 23.5 L 70 21 L 66 23.5 L 67 19.5 L 64 16.5 L 68 16 Z" fill="#FBBF24" />
    </g>

    <!-- Divider Line 1 -->
    <line x1="344" y1="134" x2="446" y2="134" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- ─── ROW 2: Candidate Profile + Evaluation Progress Bars ─── -->
    <g transform="translate(342, 142)">
      <!-- Avatar Icon -->
      <circle cx="16" cy="16" r="12" fill="#E2E8F0" />
      <circle cx="16" cy="12" r="4.5" fill="#64748B" />
      <path d="M 9 22 C 9 18.5 12 17 16 17 C 20 17 23 18.5 23 22 Z" fill="#64748B" />

      <!-- Evaluation Metric Bars -->
      <rect x="38" y="10" width="55" height="5" rx="2.5" fill="#E2E8F0" />
      <rect x="38" y="10" width="42" height="5" rx="2.5" fill="#3B82F6" />

      <rect x="38" y="18" width="45" height="4" rx="2" fill="#E2E8F0" />
      <rect x="38" y="18" width="30" height="4" rx="2" fill="#60A5FA" />
    </g>

    <!-- Divider Line 2 -->
    <line x1="344" y1="182" x2="446" y2="182" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- ─── ROW 3: Candidate Profile + Verified Green Checkmark Badge ─── -->
    <g transform="translate(342, 190)">
      <!-- Avatar Icon -->
      <circle cx="16" cy="16" r="12" fill="#E2E8F0" />
      <circle cx="16" cy="12" r="4.5" fill="#64748B" />
      <path d="M 9 22 C 9 18.5 12 17 16 17 C 20 17 23 18.5 23 22 Z" fill="#64748B" />

      <!-- Score Bar -->
      <rect x="38" y="13" width="32" height="5" rx="2.5" fill="#CBD5E1" />
    </g>

    <!-- Green Verified Checkmark Circle Badge (overlapping bottom-right) -->
    <g filter="url(#softShadow)">
      <circle cx="430" cy="214" r="18" fill="url(#greenCheckGrad)" />
      <circle cx="430" cy="214" r="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
      <!-- White Checkmark -->
      <path d="M 423 214 L 428 219 L 438 208" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
